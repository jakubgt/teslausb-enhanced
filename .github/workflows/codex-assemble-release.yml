name: Assemble exact release payload

on:
  push:
    branches: [release/v1.2.0-rc.1]
    paths:
      - .codex-upload/**
      - .github/workflows/codex-assemble-release.yml

permissions:
  contents: write

concurrency:
  group: assemble-v1.2.0-rc.1
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Reassemble, verify, and commit exact source files
        env:
          EXPECTED_PARENT: 932fcb5e6a4ffc09911a0eaadb5179c6f20f1432
          TARGET_BRANCH: release/v1.2.0-rc.1
        run: |
          set -euo pipefail

          [ "${GITHUB_REF}" = "refs/heads/${TARGET_BRANCH}" ]
          [ "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}" ] || {
            echo "Unexpected assembly parent commit" >&2
            exit 1
          }
          manifest=.codex-upload/manifest.json
          [ -f "${manifest}" ] && [ ! -L "${manifest}" ] || {
            echo "Assembly manifest is missing or symbolic" >&2
            exit 1
          }
          jq -e --arg parent "${EXPECTED_PARENT}" '
            .format == 1 and .parent == $parent and
            (.files | length) == 3 and (.tree | length) == 35
          ' "${manifest}" > /dev/null

          temporary_root=$(mktemp -d)
          trap 'rm -rf -- "${temporary_root}"' EXIT
          while IFS= read -r record
          do
            target=$(jq -er '.path' <<< "${record}")
            mode=$(jq -er '.mode' <<< "${record}")
            expected_sha256=$(jq -er '.sha256' <<< "${record}")
            case "${target}" in
              .github/workflows/build-image.yml|setup/pi/setup-teslausb|tools/teslausb-config.js) ;;
              *) echo "Unexpected reconstruction target: ${target}" >&2; exit 1 ;;
            esac
            case "${mode}" in
              100644|100755) ;;
              *) echo "Unexpected reconstruction mode: ${mode}" >&2; exit 1 ;;
            esac
            [ ! -L "${target}" ] || {
              echo "Reconstruction target is symbolic: ${target}" >&2
              exit 1
            }
            rebuilt="${temporary_root}/rebuilt"
            : > "${rebuilt}"
            while IFS= read -r part_record
            do
              part=$(jq -er '.path' <<< "${part_record}")
              part_sha256=$(jq -er '.sha256' <<< "${part_record}")
              [[ "${part}" =~ ^\.codex-upload/parts/[0-9]{3}-[0-9]{3}\.part$ ]] || {
                echo "Unsafe assembly part path: ${part}" >&2
                exit 1
              }
              [ -f "${part}" ] && [ ! -L "${part}" ] || {
                echo "Assembly part is missing or symbolic: ${part}" >&2
                exit 1
              }
              printf '%s  %s\n' "${part_sha256}" "${part}" | sha256sum -c -
              cat -- "${part}" >> "${rebuilt}"
            done < <(jq -c '.parts[]' <<< "${record}")
            printf '%s  %s\n' "${expected_sha256}" "${rebuilt}" | sha256sum -c -
            install -D -m "${mode#100}" -- "${rebuilt}" "${target}"
          done < <(jq -c '.files[]' "${manifest}")

          git add -- \
            .github/workflows/build-image.yml \
            setup/pi/setup-teslausb \
            tools/teslausb-config.js
          while IFS= read -r record
          do
            target=$(jq -er '.path' <<< "${record}")
            expected_blob=$(jq -er '.git_blob' <<< "${record}")
            expected_mode=$(jq -er '.mode' <<< "${record}")
            [ "$(git hash-object -- "${target}")" = "${expected_blob}" ] || {
              echo "Git blob mismatch after reconstruction: ${target}" >&2
              exit 1
            }
            index_line=$(git ls-files -s -- "${target}")
            [ "$(awk '{print $1}' <<< "${index_line}")" = "${expected_mode}" ] || {
              echo "Git mode mismatch after reconstruction: ${target}" >&2
              exit 1
            }
          done < <(jq -c '.tree[]' "${manifest}")

          [ -d .codex-upload ] && [ ! -L .codex-upload ]
          rm -rf -- .codex-upload
          rm -f -- .github/workflows/codex-assemble-release.yml
          git add -A -- .codex-upload .github/workflows/codex-assemble-release.yml
          while IFS= read -r changed
          do
            case "${changed}" in
              .codex-upload/*|.github/workflows/codex-assemble-release.yml|.github/workflows/build-image.yml|setup/pi/setup-teslausb|tools/teslausb-config.js) ;;
              *) echo "Unexpected staged path: ${changed}" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --quiet && {
            echo "Assembly produced no changes" >&2
            exit 1
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair exact v1.2.0-rc.1 release payload"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
