name: Build release image

on:
  push:
    branches: [main-dev]
    paths: [VERSION]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag (for example, v1.2.0 or v1.2.0-rc.1)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: teslausb-release-image
  cancel-in-progress: false

jobs:
  build:
    name: Raspberry Pi Zero 2 W arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PI_GEN_COMMIT: ca8aeed0ae300c2a89f55ce9617d5f96a27e99e5
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        id: release
        run: |
          set -euo pipefail

          release_tag=${RELEASE_TAG:-}
          if [ "${GITHUB_EVENT_NAME}" = push ]
          then
            [ "${GITHUB_REF}" = refs/heads/main-dev ] || {
              echo "VERSION push builds are restricted to main-dev" >&2
              exit 1
            }
            source_commit=$(git rev-parse --verify HEAD)
            [ "${source_commit}" = "${GITHUB_SHA}" ] || {
              echo "Checked-out VERSION commit does not match GITHUB_SHA" >&2
              exit 1
            }
          else
            if ! [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]
            then
              echo "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER" >&2
              exit 1
            fi
            git show-ref --verify --quiet "refs/tags/${release_tag}" || {
              echo "Release tag is not present in the fetched repository: ${release_tag}" >&2
              exit 1
            }
            source_commit=$(git rev-parse --verify "${release_tag}^{commit}")
            git checkout --detach "${source_commit}"
          fi
          [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Unable to resolve the release tag to one commit" >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "${source_commit}" ]
          [ -z "$(git status --porcelain=v1 --untracked-files=no)" ] || {
            echo "Release checkout contains modified tracked files" >&2
            exit 1
          }

          mapfile -t version_lines < VERSION
          [ "${#version_lines[@]}" -eq 1 ] || {
            echo "VERSION must contain exactly one line" >&2
            exit 1
          }
          version=${version_lines[0]}
          [[ "${version}" != *$'\r'* ]] || {
            echo "VERSION must use Unix line endings" >&2
            exit 1
          }
          if [ "${GITHUB_EVENT_NAME}" = push ]
          then
            release_tag="v${version}"
          fi
          if ! [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]
          then
            echo "VERSION must produce vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER" >&2
            exit 1
          fi
          [ "v${version}" = "${release_tag}" ] || {
            echo "VERSION (${version}) does not exactly match ${release_tag}" >&2
            exit 1
          }

          release_notes_path=".github/release-notes/${release_tag}.md"
          [ -f "${release_notes_path}" ] && [ ! -L "${release_notes_path}" ] &&
            [ -s "${release_notes_path}" ] || {
            echo "Required release notes are missing, empty, or symbolic: ${release_notes_path}" >&2
            exit 1
          }
          release_notes_mode=$(git ls-tree "${source_commit}" -- "${release_notes_path}" |
            awk 'NR == 1 { print $1 }')
          [ "${release_notes_mode}" = 100644 ] || {
            echo "Release notes must be a regular tracked 100644 file in the release commit" >&2
            exit 1
          }
          git cat-file -e "${source_commit}:${release_notes_path}"

          source_epoch=$(git show -s --format=%ct "${source_commit}")
          [[ "${source_epoch}" =~ ^[0-9]+$ ]] || {
            echo "Unable to resolve the release source timestamp" >&2
            exit 1
          }
          image_date=$(date -u --date="@${source_epoch}" +%F)
          asset_stem="teslausb-enhanced-${release_tag}-pi-zero-2w-arm64-trixie"

          printf 'RELEASE_TAG=%s\n' "${release_tag}" >> "${GITHUB_ENV}"
          {
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'release_notes_path=%s\n' "${release_notes_path}"
            printf 'version=%s\n' "${version}"
            printf 'source_commit=%s\n' "${source_commit}"
            printf 'source_epoch=%s\n' "${source_epoch}"
            printf 'image_date=%s\n' "${image_date}"
            printf 'asset_stem=%s\n' "${asset_stem}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require successful Validate run for VERSION push
        if: github.event_name == 'push'
        timeout-minutes: 27
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline ))
          do
            runs=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/shellcheck.yml/runs" \
              -f branch=main-dev \
              -f event=push \
              -f head_sha="${SOURCE_COMMIT}" \
              -F per_page=100)
            total_count=$(jq -er '.total_count' <<< "${runs}")
            [[ "${total_count}" =~ ^[0-9]+$ ]] || {
              echo "GitHub returned an invalid Validate run count" >&2
              exit 1
            }

            if [ "${total_count}" -eq 0 ]
            then
              echo "Waiting for the Validate run for ${SOURCE_COMMIT} to appear"
              sleep 15
              continue
            fi
            [ "${total_count}" -eq 1 ] || {
              echo "Expected one Validate push run for ${SOURCE_COMMIT}; found ${total_count}" >&2
              exit 1
            }

            run_count=$(jq -er '.workflow_runs | length' <<< "${runs}")
            [ "${run_count}" -eq 1 ] || {
              echo "Validate run response is incomplete or ambiguous" >&2
              exit 1
            }
            jq -e --arg source_commit "${SOURCE_COMMIT}" '
              .workflow_runs[0].head_sha == $source_commit and
              .workflow_runs[0].head_branch == "main-dev" and
              .workflow_runs[0].event == "push"
            ' <<< "${runs}" > /dev/null || {
              echo "Validate run identity does not match this VERSION push" >&2
              exit 1
            }

            run_status=$(jq -er '.workflow_runs[0].status' <<< "${runs}")
            run_url=$(jq -er '.workflow_runs[0].html_url' <<< "${runs}")
            if [ "${run_status}" = completed ]
            then
              conclusion=$(jq -er '.workflow_runs[0].conclusion' <<< "${runs}")
              [ "${conclusion}" = success ] || {
                echo "Validate did not succeed (${conclusion}): ${run_url}" >&2
                exit 1
              }
              echo "Validate succeeded: ${run_url}"
              break
            fi

            case "${run_status}" in
              queued|in_progress|pending|requested|waiting)
                echo "Validate is ${run_status}: ${run_url}"
                ;;
              *)
                echo "Unexpected Validate run status (${run_status}): ${run_url}" >&2
                exit 1
                ;;
            esac
            sleep 15
          done

          [ "${run_status:-}" = completed ] || {
            echo "Timed out waiting 25 minutes for Validate on ${SOURCE_COMMIT}" >&2
            exit 1
          }

      - name: Create or validate VERSION-push draft release
        if: github.event_name == 'push'
        env:
          ASSET_STEM: ${{ steps.release.outputs.asset_stem }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.release_notes_path }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local object_json="$1"
            local object_sha
            local object_type
            local depth=0

            object_type=$(jq -er '.object.type' <<< "${object_json}")
            object_sha=$(jq -er '.object.sha' <<< "${object_json}")
            while [ "${object_type}" = tag ]
            do
              depth=$((depth + 1))
              [ "${depth}" -le 8 ] || {
                echo "Release tag indirection is unexpectedly deep" >&2
                return 1
              }
              object_json=$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_type=$(jq -er '.object.type' <<< "${object_json}")
              object_sha=$(jq -er '.object.sha' <<< "${object_json}")
            done
            [ "${object_type}" = commit ] || {
              echo "Release tag does not ultimately target a commit" >&2
              return 1
            }
            printf '%s\n' "${object_sha}"
          }

          tag_response=
          if tag_response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>&1)
          then
            tag_commit=$(resolve_tag_commit "${tag_response}")
            [ "${tag_commit}" = "${SOURCE_COMMIT}" ] || {
              echo "Existing ${RELEASE_TAG} tag does not target ${SOURCE_COMMIT}" >&2
              exit 1
            }
          else
            case "${tag_response}" in
              *'(HTTP 404)'*) ;;
              *)
                printf '%s\n' "${tag_response}" >&2
                exit 1
                ;;
            esac
            tag_payload=$(jq -n \
              --arg ref "refs/tags/${RELEASE_TAG}" \
              --arg sha "${SOURCE_COMMIT}" \
              '{ref: $ref, sha: $sha}')
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --input - <<< "${tag_payload}" > /dev/null
            tag_response=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
            [ "$(resolve_tag_commit "${tag_response}")" = "${SOURCE_COMMIT}" ] || {
              echo "Created tag does not resolve to the release source commit" >&2
              exit 1
            }
          fi

          prerelease=false
          if [[ "${VERSION}" == *-rc.* ]]
          then
            prerelease=true
          fi
          expected_title="TeslaUSB Enhanced ${RELEASE_TAG}"
          expected_body=$(< "${RELEASE_NOTES_PATH}")

          release_response=
          if release_response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)
          then
            jq -e --arg tag "${RELEASE_TAG}" \
              --arg title "${expected_title}" \
              --arg source_commit "${SOURCE_COMMIT}" \
              --argjson prerelease "${prerelease}" \
              '.tag_name == $tag and .name == $title and .draft == true and
               .target_commitish == $source_commit and
               .prerelease == $prerelease' <<< "${release_response}" > /dev/null || {
              echo "Existing release is not the expected matching draft" >&2
              exit 1
            }
            existing_body=$(jq -r '.body // ""' <<< "${release_response}")
            [ "${existing_body}" = "${expected_body}" ] || {
              echo "Existing draft release notes do not match checked-in notes" >&2
              exit 1
            }
          else
            case "${release_response}" in
              *'(HTTP 404)'*) ;;
              *)
                printf '%s\n' "${release_response}" >&2
                exit 1
                ;;
            esac
            release_payload=$(jq -n \
              --arg tag_name "${RELEASE_TAG}" \
              --arg target_commitish "${SOURCE_COMMIT}" \
              --arg name "${expected_title}" \
              --rawfile body "${RELEASE_NOTES_PATH}" \
              --argjson prerelease "${prerelease}" \
              '{
                tag_name: $tag_name,
                target_commitish: $target_commitish,
                name: $name,
                body: $body,
                draft: true,
                prerelease: $prerelease,
                make_latest: "false"
              }')
            release_response=$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" --input - \
              <<< "${release_payload}")
          fi

          expected_assets=(
            "${ASSET_STEM}.img.xz"
            "${ASSET_STEM}.img.xz.sha256"
            "${ASSET_STEM}.image-metadata.json"
            "${ASSET_STEM}.packages.tsv"
          )
          existing_assets=$(jq -r '.assets[].name' <<< "${release_response}")
          for expected_asset in "${expected_assets[@]}"
          do
            if grep -Fx -- "${expected_asset}" <<< "${existing_assets}" > /dev/null
            then
              echo "Draft retry contains an expected asset and cannot be reused: ${expected_asset}" >&2
              exit 1
            fi
          done

      - name: Confirm matching GitHub release exists
        env:
          ASSET_STEM: ${{ steps.release.outputs.asset_stem }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_tag=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          [ "${actual_tag}" = "${RELEASE_TAG}" ] || {
            echo "GitHub release does not match ${RELEASE_TAG}" >&2
            exit 1
          }
          existing_assets=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          expected_assets=(
            "${ASSET_STEM}.img.xz"
            "${ASSET_STEM}.img.xz.sha256"
            "${ASSET_STEM}.image-metadata.json"
            "${ASSET_STEM}.packages.tsv"
          )
          for expected_asset in "${expected_assets[@]}"
          do
            if grep -Fx -- "${expected_asset}" <<< "${existing_assets}" > /dev/null
            then
              echo "Refusing to replace existing release asset: ${expected_asset}" >&2
              exit 1
            fi
          done

      - name: Reclaim safe ephemeral runner space
        run: |
          set -euo pipefail
          [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] || {
            echo "Refusing automatic disk cleanup outside a GitHub-hosted ephemeral runner" >&2
            exit 1
          }

          cleanup_paths=(
            /opt/ghc
            /opt/hostedtoolcache
            /usr/local/.ghcup
            /usr/local/lib/android
            /usr/share/dotnet
          )
          for cleanup_path in "${cleanup_paths[@]}"
          do
            [ -e "${cleanup_path}" ] || continue
            [ -d "${cleanup_path}" ] && [ ! -L "${cleanup_path}" ] || {
              echo "Refusing to remove an unexpected cleanup path: ${cleanup_path}" >&2
              exit 1
            }
            [ "$(readlink -f -- "${cleanup_path}")" = "${cleanup_path}" ] || {
              echo "Refusing to remove a redirected cleanup path: ${cleanup_path}" >&2
              exit 1
            }
            case "${cleanup_path}" in
              /opt/ghc|/opt/hostedtoolcache|/usr/local/.ghcup|/usr/local/lib/android|/usr/share/dotnet)
                sudo rm -rf --one-file-system -- "${cleanup_path}"
                ;;
              *)
                echo "Cleanup path is outside the fixed allowlist: ${cleanup_path}" >&2
                exit 1
                ;;
            esac
          done
          if command -v docker > /dev/null && sudo docker info > /dev/null 2>&1
          then
            sudo docker system prune --all --force --volumes
          fi
          sudo apt-get clean
          df -h -- "${RUNNER_TEMP}"

      - name: Install native pi-gen dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            arch-test bc bmap-tools coreutils curl debootstrap dosfstools \
            e2fsprogs file git gpg grep jq kmod libarchive-tools libcap2-bin \
            parted pigz qemu-user-binfmt quilt rsync util-linux xxd xz-utils \
            zerofree zip
          command -v gh > /dev/null || {
            echo "GitHub CLI is unavailable on the hosted runner" >&2
            exit 1
          }

      - name: Require at least 25 GiB free for pi-gen
        run: |
          set -euo pipefail
          available_bytes=$(df -PB1 --output=avail "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')
          minimum_bytes=$((25 * 1024 * 1024 * 1024))
          [[ "${available_bytes}" =~ ^[0-9]+$ ]] || {
            echo "Unable to determine free build space" >&2
            exit 1
          }
          if [ "${available_bytes}" -lt "${minimum_bytes}" ]
          then
            echo "pi-gen requires at least 25 GiB free; only ${available_bytes} bytes are available" >&2
            df -h -- "${RUNNER_TEMP}"
            exit 1
          fi
          df -h -- "${RUNNER_TEMP}"

      - name: Clone exact pi-gen source
        id: pigen
        run: |
          set -euo pipefail
          [[ "${PI_GEN_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          pi_gen_dir="${RUNNER_TEMP}/pi-gen"
          [ ! -e "${pi_gen_dir}" ] || {
            echo "Refusing to replace existing pi-gen path: ${pi_gen_dir}" >&2
            exit 1
          }
          git init --quiet "${pi_gen_dir}"
          git -C "${pi_gen_dir}" remote add origin https://github.com/RPi-Distro/pi-gen.git
          git -C "${pi_gen_dir}" fetch --depth=1 origin "${PI_GEN_COMMIT}"
          git -C "${pi_gen_dir}" checkout --detach "${PI_GEN_COMMIT}"
          [ "$(git -C "${pi_gen_dir}" rev-parse HEAD)" = "${PI_GEN_COMMIT}" ]
          git -C "${pi_gen_dir}" cat-file -e "${PI_GEN_COMMIT}:stage2/prerun.sh"
          [ -z "$(git -C "${pi_gen_dir}" status --porcelain=v1 --untracked-files=no)" ]
          printf 'directory=%s\n' "${pi_gen_dir}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned TeslaUSB stage
        env:
          PI_GEN_DIR: ${{ steps.pigen.outputs.directory }}
        run: |
          set -euo pipefail
          cd "${PI_GEN_DIR}"
          "${GITHUB_WORKSPACE}/pi-gen-sources/prepare.sh"
          grep -Fx "RELEASE=trixie" config > /dev/null
          grep -F 'STAGE_LIST="stage0 stage1 stage2 stage_teslausb"' config > /dev/null

      - name: Build uncompressed arm64 image natively
        env:
          ASSET_STEM: ${{ steps.release.outputs.asset_stem }}
          IMAGE_DATE: ${{ steps.release.outputs.image_date }}
          PI_GEN_DIR: ${{ steps.pigen.outputs.directory }}
          SOURCE_EPOCH: ${{ steps.release.outputs.source_epoch }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = aarch64 ] || {
            echo "Release image must be built natively on an arm64 runner" >&2
            exit 1
          }
          build_config="${RUNNER_TEMP}/teslausb-release-config"
          printf '%s\n' \
            'DEPLOY_COMPRESSION=none' \
            "IMG_DATE=${IMAGE_DATE}" \
            "IMG_FILENAME=${ASSET_STEM}" > "${build_config}"
          chmod 0600 "${build_config}"

          cd "${PI_GEN_DIR}"
          if ! sudo env SOURCE_DATE_EPOCH="${SOURCE_EPOCH}" \
            ./build.sh -c "${build_config}"
          then
            df -h -- "${RUNNER_TEMP}" || true
            find work -name build.log -type f -print 2> /dev/null || true
            exit 1
          fi
          sudo chown -R -- "$(id -u):$(id -g)" deploy
          df -h -- "${RUNNER_TEMP}"

      - name: Verify image and create manifests
        id: assets
        env:
          ASSET_STEM: ${{ steps.release.outputs.asset_stem }}
          PI_GEN_DIR: ${{ steps.pigen.outputs.directory }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          SOURCE_EPOCH: ${{ steps.release.outputs.source_epoch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          dist_dir="${RUNNER_TEMP}/release-assets"
          mkdir -m 0700 -- "${dist_dir}"

          images=()
          while IFS= read -r -d '' image
          do
            images+=("${image}")
          done < <(find "${PI_GEN_DIR}/deploy" -maxdepth 1 -type f -name '*.img' -print0)
          [ "${#images[@]}" -eq 1 ] || {
            echo "Expected exactly one uncompressed pi-gen image; found ${#images[@]}" >&2
            exit 1
          }
          raw_image="${dist_dir}/${ASSET_STEM}.img"
          [ "$(basename -- "${images[0]}")" = "${ASSET_STEM}.img" ] || {
            echo "pi-gen produced an unexpected image name: ${images[0]}" >&2
            exit 1
          }
          mv -- "${images[0]}" "${raw_image}"

          packages="${dist_dir}/${ASSET_STEM}.packages.tsv"
          metadata="${dist_dir}/${ASSET_STEM}.image-metadata.json"
          bash "${GITHUB_WORKSPACE}/tools/verify-release-image.sh" \
            "${raw_image}" "${VERSION}" "${SOURCE_COMMIT}" "${PI_GEN_COMMIT}" \
            "${packages}" "${metadata}"

          raw_sha256=$(sha256sum -- "${raw_image}")
          raw_sha256=${raw_sha256%% *}
          env -u XZ_DEFAULTS -u XZ_OPT xz --threads=1 --check=crc64 \
            --lzma2=preset=6 -- "${raw_image}"
          compressed_image="${raw_image}.xz"
          [ -f "${compressed_image}" ] && [ ! -L "${compressed_image}" ]
          [ ! -e "${raw_image}" ]
          env -u XZ_DEFAULTS -u XZ_OPT xz --test -- "${compressed_image}"

          compressed_bytes=$(stat -c %s -- "${compressed_image}")
          maximum_release_bytes=$((2 * 1024 * 1024 * 1024 - 1))
          [ "${compressed_bytes}" -le "${maximum_release_bytes}" ] || {
            echo "Compressed image exceeds the 2 GiB release-asset safety limit" >&2
            exit 1
          }
          compressed_sha256=$(sha256sum -- "${compressed_image}")
          compressed_sha256=${compressed_sha256%% *}
          package_manifest_sha256=$(sha256sum -- "${packages}")
          package_manifest_sha256=${package_manifest_sha256%% *}
          build_completed_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          checksum_file="${compressed_image}.sha256"
          printf '%s  %s\n' "${compressed_sha256}" \
            "$(basename -- "${compressed_image}")" > "${checksum_file}"
          chmod 0644 "${checksum_file}"
          (
            cd "${dist_dir}"
            sha256sum -c -- "$(basename -- "${checksum_file}")"
          )

          metadata_tmp=$(mktemp "${dist_dir}/.image-metadata.XXXXXXXX")
          jq -S \
            --arg image_asset "$(basename -- "${compressed_image}")" \
            --arg checksum_asset "$(basename -- "${checksum_file}")" \
            --arg package_manifest "$(basename -- "${packages}")" \
            --arg raw_image_sha256 "${raw_sha256}" \
            --arg compressed_image_sha256 "${compressed_sha256}" \
            --arg package_manifest_sha256 "${package_manifest_sha256}" \
            --arg source_epoch "${SOURCE_EPOCH}" \
            --arg build_completed_utc "${build_completed_utc}" \
            --arg runner_arch "${RUNNER_ARCH}" \
            --arg runner_image_os "${ImageOS:-unknown}" \
            --arg runner_image_version "${ImageVersion:-unknown}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg compression 'xz --threads=1 --check=crc64 --lzma2=preset=6' \
            --argjson compressed_bytes "${compressed_bytes}" \
            '.artifact = {
                image: $image_asset,
                checksum: $checksum_asset,
                package_manifest: $package_manifest,
                raw_image_sha256: $raw_image_sha256,
                compressed_image_sha256: $compressed_image_sha256,
                package_manifest_sha256: $package_manifest_sha256,
                compressed_bytes: $compressed_bytes,
                compression: $compression
              }
              | .build = {
                source_epoch: ($source_epoch | tonumber),
                build_completed_utc: $build_completed_utc,
                runner_arch: $runner_arch,
                runner_image_os: $runner_image_os,
                runner_image_version: $runner_image_version,
                workflow_run: $workflow_run,
                run_attempt: ($run_attempt | tonumber)
              }' "${metadata}" > "${metadata_tmp}"
          mv -fT -- "${metadata_tmp}" "${metadata}"
          chmod 0644 "${metadata}" "${packages}"
          jq -e \
            '.image.architecture == "arm64" and
             .image.debian_codename == "trixie" and
             .image.first_user_locked == true and
             .image.active_setup_config_present == false and
             .artifact.compressed_image_sha256 != ""' \
            "${metadata}" > /dev/null

          for text_asset in "${checksum_file}" "${metadata}" "${packages}"
          do
            if grep -aEq \
              'github_pat_|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|must-not-leak' \
              "${text_asset}"
            then
              echo "Potential credential material detected in $(basename -- "${text_asset}")" >&2
              exit 1
            fi
          done
          [ -z "$(find "${dist_dir}" -maxdepth 1 -type f -name '*.img' -print -quit)" ] || {
            echo "Uncompressed image remains in the release directory" >&2
            exit 1
          }

          {
            printf 'image=%s\n' "${compressed_image}"
            printf 'checksum=%s\n' "${checksum_file}"
            printf 'metadata=%s\n' "${metadata}"
            printf 'packages=%s\n' "${packages}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload verified assets to matching release
        env:
          CHECKSUM_ASSET: ${{ steps.assets.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_ASSET: ${{ steps.assets.outputs.image }}
          METADATA_ASSET: ${{ steps.assets.outputs.metadata }}
          PACKAGES_ASSET: ${{ steps.assets.outputs.packages }}
        run: |
          set -euo pipefail
          assets=(
            "${IMAGE_ASSET}"
            "${CHECKSUM_ASSET}"
            "${METADATA_ASSET}"
            "${PACKAGES_ASSET}"
          )
          existing_assets=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"
          do
            [ -f "${asset}" ] && [ ! -L "${asset}" ] || {
              echo "Release asset is missing or symbolic: ${asset}" >&2
              exit 1
            }
            asset_name=$(basename -- "${asset}")
            if grep -Fx -- "${asset_name}" <<< "${existing_assets}" > /dev/null
            then
              echo "Refusing to replace existing release asset: ${asset_name}" >&2
              exit 1
            fi
          done

          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}"

          uploaded_assets=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"
          do
            grep -Fx -- "$(basename -- "${asset}")" <<< "${uploaded_assets}" > /dev/null || {
              echo "Uploaded asset is not visible on the release: ${asset}" >&2
              exit 1
            }
          done

      - name: Publish verified VERSION-push release
        if: github.event_name == 'push'
        env:
          CHECKSUM_ASSET: ${{ steps.assets.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_ASSET: ${{ steps.assets.outputs.image }}
          METADATA_ASSET: ${{ steps.assets.outputs.metadata }}
          PACKAGES_ASSET: ${{ steps.assets.outputs.packages }}
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.release_notes_path }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local object_json="$1"
            local object_sha
            local object_type
            local depth=0

            object_type=$(jq -er '.object.type' <<< "${object_json}")
            object_sha=$(jq -er '.object.sha' <<< "${object_json}")
            while [ "${object_type}" = tag ]
            do
              depth=$((depth + 1))
              [ "${depth}" -le 8 ] || return 1
              object_json=$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_type=$(jq -er '.object.type' <<< "${object_json}")
              object_sha=$(jq -er '.object.sha' <<< "${object_json}")
            done
            [ "${object_type}" = commit ] || return 1
            printf '%s\n' "${object_sha}"
          }

          tag_response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          [ "$(resolve_tag_commit "${tag_response}")" = "${SOURCE_COMMIT}" ] || {
            echo "Release tag changed during the image build" >&2
            exit 1
          }

          release_response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          prerelease=false
          make_latest=true
          if [[ "${VERSION}" == *-rc.* ]]
          then
            prerelease=true
            make_latest=false
          fi
          expected_title="TeslaUSB Enhanced ${RELEASE_TAG}"
          expected_body=$(< "${RELEASE_NOTES_PATH}")
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg title "${expected_title}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            --argjson prerelease "${prerelease}" \
            '.tag_name == $tag and .name == $title and .draft == true and
             .target_commitish == $source_commit and
             .prerelease == $prerelease' <<< "${release_response}" > /dev/null || {
            echo "Release is no longer the expected unpublished draft" >&2
            exit 1
          }
          [ "$(jq -r '.body // ""' <<< "${release_response}")" = "${expected_body}" ] || {
            echo "Draft release notes changed during the image build" >&2
            exit 1
          }

          assets=(
            "${IMAGE_ASSET}"
            "${CHECKSUM_ASSET}"
            "${METADATA_ASSET}"
            "${PACKAGES_ASSET}"
          )
          for asset in "${assets[@]}"
          do
            asset_name=$(basename -- "${asset}")
            remote_digest=$(jq -er --arg name "${asset_name}" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then .[0].digest else error("asset count mismatch") end
            ' <<< "${release_response}")
            local_digest=$(sha256sum -- "${asset}")
            local_digest="sha256:${local_digest%% *}"
            [ "${remote_digest}" = "${local_digest}" ] || {
              echo "Remote release digest does not match verified asset: ${asset_name}" >&2
              exit 1
            }
          done

          release_id=$(jq -er '.id' <<< "${release_response}")
          publish_payload=$(jq -n \
            --argjson prerelease "${prerelease}" \
            --arg make_latest "${make_latest}" \
            '{draft: false, prerelease: $prerelease, make_latest: $make_latest}')
          published_release=$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --input - \
            <<< "${publish_payload}")
          jq -e --arg tag "${RELEASE_TAG}" --argjson prerelease "${prerelease}" \
            '.tag_name == $tag and .draft == false and .prerelease == $prerelease' \
            <<< "${published_release}" > /dev/null || {
            echo "GitHub did not publish the verified release in the expected state" >&2
            exit 1
          }
