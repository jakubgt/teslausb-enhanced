# TeslaUSB: bounded volatile system logs; read with logread.
# BusyBox applies /etc/syslog.conf file rules before its -C memory ring, so an
# explicit empty config is necessary even when SYSLOG_OPTS already says -C128.
# Root must remain remountable read-only without pausing the logger.
[Service]
ExecStart=
ExecStart=/sbin/syslogd -n -C128 -f /dev/null
